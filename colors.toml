mode = "dark"

# Neon night pack — electric violet + cyan nitro.
# Cursor-literal #D000FF stays on borders / ANSI magenta / keyboard LEDs.
# Main `accent` is brand violet #9246FF (post-Unite) — same family, readable
# on filled highlights; not a 1:1 cursor paste into every accent surface.
# Sampled from in-game settings UI + cursor (2026-10-02); mid-ground tune.
accent = "#9246FF"
selection = "#2A1450"
muted = "#6E5A9A"

background = "#14081F"
dark_background = "#0A0514"
darker_background = "#0C0618"
lighter_background = "#241448"

foreground = "#F2E8FF"
dark_foreground = "#8A7AAA"
light_foreground = "#D4C4F0"
bright_foreground = "#FFFFFF"

hyprland_active_border = "rgba(D000FFee) rgba(40F0FFee) 45deg"
hyprland_inactive_border = "rgba(502094aa)"

red = "#FF6B88"
yellow = "#FFD400"
orange = "#FF8A40"
green = "#6AFFB0"
cyan = "#40F0FF"
blue = "#7A9AFF"
magenta = "#D000FF"
brown = "#7A4A5A"

bright_red = "#FF8AA0"
bright_yellow = "#FFE866"
bright_green = "#9AFFC8"
bright_cyan = "#80F8FF"
bright_blue = "#A0B8FF"
bright_magenta = "#E070FF"
